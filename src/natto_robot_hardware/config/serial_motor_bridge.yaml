serial_motor_bridge:
  ros__parameters:
    # メカナム用ST-Linkの個体番号で固定。USBの接続位置には依存しません。
    serial_path: "/dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066EFF565653756687235135-if02"

    command_topic: "/command_joint_states"
    joint_state_topic: "/joint_states"

    # 通常時は車輪速度を指令する閉ループ制御。エンコーダ故障時だけ
    # open_loop_normalizedを専用launchから指定します。
    command_mode: "closed_loop_velocity"
    pid: true

    # ROS側のJointState.velocityはrad/s、シリアル送受信の車輪速度はrps。
    # このbridge内でrad/s -> rpsへ変換してマイコンへ送ります。
    input_unit: "radps"

    max_rps: 4.0

    # open_loop_normalized専用。4輪の比率を保ったまま[-1, 1]へ正規化します。
    open_loop_full_scale_rps: 4.0
    open_loop_output_limit: 1.0
    open_loop_slew_rate_per_sec: 1.0

    timeout_ms: 300
    reconnect_interval_ms: 1000
    feedback_timeout_ms: 200
    startup_feedback_timeout_ms: 1000
    feedback_recovery_count: 3
    # 自動launchで有効化。1秒ごとの失敗回数と継続時間を両方満たしたら再起動。
    restart_failure_count: 1
    restart_timeout_ms: 1000
    restart_recovery_ms: 3000
    max_feedback_dt_sec: 0.1

    # Fixed STM frame IDs are defined in serial_protocol.hpp.
    # These encoder defaults come from STM main.cpp; verify the actual wheel gearboxes.
    encoder_ppr: [2048, 2048, 2048, 2048]
    gear_rate: [40.833333333333336, 40.833333333333336, 40.833333333333336, 40.833333333333336]
    max_motor_rps: [4.0, 4.0, 4.0, 4.0]
    stop_mode: false
    pos_kp: [0.0, 0.0, 0.0, 0.0]
    pos_ki: [0.0, 0.0, 0.0, 0.0]
    pos_kd: [0.0, 0.0, 0.0, 0.0]
    # Preserve cumulative counts across ROS reconnect; switch homing is opt-in.
    reset_encoder_origin: [false, false, false, false]
    reset_encoder_origin_with_switch: [false, false, false, false]
    encoder_origin_switch_state: [true, true, true, true]

    wheel_names:
      - "mecanum_wheel_fl"
      - "mecanum_wheel_fr"
      - "mecanum_wheel_rl"
      - "mecanum_wheel_rr"

    # wheel_namesと同じ順番。ROSの指令方向を実機モーターの極性へ変換します。
    # 指令をSTMのモーター座標へ変換し、JointStateの速度・位置をROS座標へ戻します。
    wheel_polarities: [-1, 1, -1, 1]

    # STM set_direction=(polarity < 0)へ変換。全輪で正のモーター出力と
    # 測定速度の符号を合わせます。ROS座標変換用のwheel_polaritiesとは別です。
    # FL, FR, RL, RR
    encoder_polarities: [-1, -1, -1, -1]
