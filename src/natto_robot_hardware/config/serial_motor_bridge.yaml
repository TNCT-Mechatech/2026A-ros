serial_motor_bridge:
  ros__parameters:
    # serial_path: "/dev/serial/by-path/platform-xhci-hcd.1-usb-0:1:1.2"

    command_topic: "/command_joint_states"
    joint_state_topic: "/joint_states"

    # ROS側のJointState.velocityはrad/s、シリアル送受信の車輪速度はrps。
    # このbridge内でrad/s -> rpsへ変換してマイコンへ送ります。
    input_unit: "radps"

    max_rps: 2.0
    timeout_ms: 300

    command_frame_id: 0
    feedback_frame_id: 1

    wheel_names:
      - "mecanum_wheel_fl"
      - "mecanum_wheel_fr"
      - "mecanum_wheel_rl"
      - "mecanum_wheel_rr"
