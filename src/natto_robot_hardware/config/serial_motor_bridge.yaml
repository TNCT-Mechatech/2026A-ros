serial_motor_bridge:
  ros__parameters:
    # メカナム用ST-Linkの個体番号で固定。USBの接続位置には依存しません。
    serial_path: "/dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066EFF565653756687235135-if02"

    command_topic: "/command_joint_states"
    joint_state_topic: "/joint_states"

    # 通常時は車輪速度を指令する閉ループ制御。エンコーダ故障時だけ
    # open_loop_normalizedを専用launchから指定します。
    command_mode: "closed_loop_velocity"
    pid: true

    # ROS側のJointState.velocityはrad/s、シリアル送受信の車輪速度はrps。
    # このbridge内でrad/s -> rpsへ変換してマイコンへ送ります。
    input_unit: "radps"

    max_rps: 4.0

    # open_loop_normalized専用。4輪の比率を保ったまま[-1, 1]へ正規化します。
    open_loop_full_scale_rps: 4.0
    open_loop_output_limit: 1.0
    open_loop_slew_rate_per_sec: 1.0

    timeout_ms: 300
    reconnect_interval_ms: 1000
    feedback_timeout_ms: 200
    startup_feedback_timeout_ms: 1000
    feedback_recovery_count: 3
    # 自動launchで有効化。1秒ごとの失敗回数と継続時間を両方満たしたら再起動。
    restart_failure_count: 1
    restart_timeout_ms: 1000
    restart_recovery_ms: 3000
    max_feedback_dt_sec: 0.1

    command_frame_id: 0
    feedback_frame_id: 1

    wheel_names:
      - "mecanum_wheel_fl"
      - "mecanum_wheel_fr"
      - "mecanum_wheel_rl"
      - "mecanum_wheel_rr"

    # wheel_namesと同じ順番。ROSの指令方向を実機モーターの極性へ変換します。
    # マイコンへ送信する目標値に適用され、受信値には適用されません。
    wheel_polarities: [-1, 1, -1, 1]

    # エンコーダの極性
    # FL, FR, RL, RR
    encoder_polarities: [-1, 1, -1, 1]
