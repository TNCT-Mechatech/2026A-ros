inject_serial_node:
  ros__parameters:
    reconnect_interval_ms: 1000
    timeout_ms: 300
    # Encoder constructor defaults from STM; verify separately for inject and roll.
    encoder_ppr: [2048, 2048, 2048, 2048]
    gear_rate: [71.0, 40.833333333333336, 40.833333333333336, 40.833333333333336]
    encoder_polarities: [1, 1, 1, 1]
    max_motor_rps: [4.0, 4.0, 4.0, 4.0]
    stop_mode: false
    pos_kp: [0.0, 0.0, 0.0, 0.0]
    pos_ki: [0.0, 0.0, 0.0, 0.0]
    pos_kd: [0.0, 0.0, 0.0, 0.0]
    reset_encoder_origin: [false, false, false, false]
    reset_encoder_origin_with_switch: [false, false, false, false]
    encoder_origin_switch_state: [true, true, true, true]
    # 旧send-only運用設定を維持。新STMの返信監視にはtrueを指定。
    monitor_serial_updates: false
    # monitor_serial_updates=trueのときだけ使用。
    serial_update_failure_limit: 5
    # 自動launchで有効化。1秒ごとの失敗回数と継続時間を両方満たしたら再起動。
    restart_failure_count: 1
    restart_timeout_ms: 1000
    restart_recovery_ms: 3000
    # 注入用ST-Link。USBの接続位置には依存しません。
    serial_path: "/dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_0671FF505071655067254019-if02"

roll_serial_node:
  ros__parameters:
    reconnect_interval_ms: 1000
    timeout_ms: 300
    # Encoder constructor defaults from STM; verify separately for inject and roll.
    encoder_ppr: [2048, 2048, 2048, 2048]
    gear_rate: [71.0, 40.833333333333336, 40.833333333333336, 40.833333333333336]
    encoder_polarities: [1, 1, 1, 1]
    max_motor_rps: [4.0, 4.0, 4.0, 4.0]
    stop_mode: false
    pos_kp: [0.0, 0.0, 0.0, 0.0]
    pos_ki: [0.0, 0.0, 0.0, 0.0]
    pos_kd: [0.0, 0.0, 0.0, 0.0]
    reset_encoder_origin: [false, false, false, false]
    reset_encoder_origin_with_switch: [false, false, false, false]
    encoder_origin_switch_state: [true, true, true, true]
    # 旧send-only運用設定を維持。新STMの返信監視にはtrueを指定。
    monitor_serial_updates: false
    # monitor_serial_updates=trueのときだけ使用。
    serial_update_failure_limit: 5
    # 自動launchで有効化。1秒ごとの失敗回数と継続時間を両方満たしたら再起動。
    restart_failure_count: 1
    restart_timeout_ms: 1000
    restart_recovery_ms: 3000
    # ロール用ST-Link。USBの接続位置には依存しません。
    serial_path: "/dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_0671FF555185754867214745-if02"
